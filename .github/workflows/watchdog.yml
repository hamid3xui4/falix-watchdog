name: Falix 24/7 Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: 'loop' (14.5 min continuous) or 'once' (single check)"
        required: false
        default: "loop"

concurrency:
  group: falix-watchdog
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install websockets
        run: pip install --quiet websockets

      - name: Run Falix Watchdog
        env:
          FALIX_KEY: ${{ secrets.FALIX_KEY }}
          FALIX_SERVER_ID: ${{ secrets.FALIX_SERVER_ID }}
          RUN_MODE: ${{ github.event.inputs.mode || 'loop' }}
        run: |
          if [ "$RUN_MODE" = "once" ]; then
            python3 watchdog.py --loop 0
          else
            python3 watchdog.py --loop 30 --max-seconds 870
          fi

      - name: Chain next run (zero-gap 24/7)
        if: always() && (github.event.inputs.mode != 'once')
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            curl -s -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/watchdog.yml/dispatches" \
              -d '{"ref":"main","inputs":{"mode":"loop"}}' || true
          fi
